[package]
name = "blue_mango"
version = "0.1.0"
description = "Blue-Mango milestone escrow — Solana/Anchor port of the Solidity BlueMango contract"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "blue_mango"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
